# srl.yml -- drop this at the root of a Zephyr repo to register it with the
# SRL devkit. Any sibling repo of SRL-ZEPHYR-DEVKIT that has this file is
# auto-discovered and mounted at /workspaces/<dir-name> the next time you run
# `srl`. The directory name is the address you type: `srl build <dir>/<board>`.

# Display name (cosmetic; the directory name is what you type on the CLI).
name: MY-ZEPHYR-REPO

# Optional: subdirectory that holds the west workspace (its .west), relative to
# the repo root. Defaults to the repo root -- only set it when .west lives in a
# subdir (e.g. WALRUS keeps its workspace at ground/station/).
# workspace: ground/station

# Application source dir, relative to the workspace (the repo root unless
# `workspace:` is set above). Passed to `west build`.
app: app

# How `srl init` bootstraps the west workspace, for a repo that isn't one yet
# (no .west/). Only consulted by `srl init` / the auto-init in `srl build` /
# `srl update`; an already-initialized repo ignores it. Optional.
#
#   manifest: https://github.com/CU-SRL/some-manifest   # remote -> west init -m
#   manifest: app            # local -> west init -l <workspace>/app
#
# A value with "://" (or git@) is treated as a URL and cloned. Otherwise it's a
# LOCAL subdir (relative to the workspace) that contains west.yml. It must be a
# subdir, not the root: `west init -l` creates .west in the manifest dir's
# PARENT, so a root-level manifest would put .west outside the repo. With no
# `manifest:` set, srl auto-detects a single manifest-bearing subdir.
# manifest: app
# manifest_rev: main         # optional, --mr (remote manifests)
# manifest_file: west.yml    # optional, --mf (non-default manifest filename)

# Zephyr version this repo targets (informational only). Each repo builds
# against its OWN zephyr/ tree pulled by `west update`, not the image's, so
# this need not match the image -- it just prints a note if it differs. The
# image's SDK + base deps cover Zephyr v3.7+/v4.x. Optional.
zephyr: v4.0.0

# Board used when you omit one, e.g. `srl build MY-ZEPHYR-REPO`.
default_board: nucleo_h723zg

# Board used by `srl run` (the native_sim executable).
sim_board: native_sim/native/64

# Friendly aliases -> real Zephyr board names. Unlisted names pass through
# to west unchanged, so you can always type the full board name.
boards:
  nucleo: nucleo_h723zg
  sim: native_sim/native/64

# Per-board extra conf/overlay files (relative to the app dir), applied
# automatically when that board is built.
board_config:
  native_sim/native/64:
    conf: [native_sim.conf]
    overlay: [native_sim.overlay]

# Named config overlays toggled by flags. `-d/--debug` uses `debug`.
configs:
  debug: debug.conf

# Default `west flash` runner per board (override with `srl flash ... -r`).
runners:
  phoenix_pcb: jlink
